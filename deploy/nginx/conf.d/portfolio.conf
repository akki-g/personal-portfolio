# Edge reverse proxy for the portfolio and independently deployed project apps.
# The portfolio uses the root domain; project containers use subdomains.

# ── HTTP: ACME challenge + redirect everything else to HTTPS ──────────────────
server {
    listen 80;
    server_name its-akki.com www.its-akki.com api.its-akki.com citepilot.its-akki.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Portfolio SPA + path-based project apps ───────────────────────────────────
server {
    listen 443 ssl;
    server_name its-akki.com www.its-akki.com;

    ssl_certificate     /etc/letsencrypt/live/its-akki.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/its-akki.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    # Forwarded headers (inherited by all locations in this server block).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Project apps: the repeatable pattern ─────────────────────────────────
    # To add a project:
    #   1. add its service to docker-compose.yml (same network, no published ports)
    #   2. copy the block below with the project's <slug> and internal port
    #   3. docker compose exec proxy nginx -s reload
    # The trailing slash on proxy_pass strips the /apps/<slug>/ prefix, so the
    # upstream app sees requests rooted at "/". Build the app to work under the
    # /apps/<slug>/ base path (set its base href / router basename accordingly).
    #
    # location /apps/trading/ {
    #     proxy_pass http://trading:8080/;
    # }

    # Portfolio SPA catch-all. This must stay last.
    location / {
        proxy_pass http://frontend:80;
    }
}

# ── CitePilot project container ───────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name citepilot.its-akki.com;

    ssl_certificate     /etc/letsencrypt/live/its-akki.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/its-akki.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Resolve through Docker at request time. This lets the portfolio proxy
    # start even when the independently deployed CitePilot stack is offline.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $citepilot_upstream http://citepilot-web:8080;

    location / {
        proxy_pass $citepilot_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ── Backend API ───────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name api.its-akki.com;

    ssl_certificate     /etc/letsencrypt/live/its-akki.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/its-akki.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # User-uploaded media, served straight from the shared volume.
    location /media/ {
        alias /srv/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://backend:8000;
    }
}
