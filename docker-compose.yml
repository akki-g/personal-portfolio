# Production stack: single VPS, path-based routing behind an nginx edge proxy.
# Bring up with:  docker compose up -d --build
# Local dev instead:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  backend:
    build: ./backend
    image: portfolio-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env            # ANTHROPIC_API_KEY, and DJANGO_SECRET_KEY in prod
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "its-akki.com,www.its-akki.com,api.its-akki.com"
      DJANGO_CSRF_TRUSTED_ORIGINS: "https://its-akki.com,https://www.its-akki.com,https://api.its-akki.com"
    volumes:
      - ./backend/db.sqlite3:/app/db.sqlite3   # SQLite persists on the host
      - ./backend/media:/app/media             # user uploads persist on the host
    expose:
      - "8000"

  frontend:
    build:
      context: ./wed-front
      args:
        VITE_API_BASE_URL: "https://api.its-akki.com/api/"
        VITE_API_TOKEN: "${VITE_API_TOKEN:-}"
    image: portfolio-frontend
    restart: unless-stopped
    expose:
      - "80"

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./backend/media:/srv/media:ro          # media served directly by nginx
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    networks:
      - default
      - portfolio_edge

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    # Renewal loop. First-time issuance is a one-off (see deploy/README.md).
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

networks:
  portfolio_edge:
    name: portfolio-edge
    external: true
