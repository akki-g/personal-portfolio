name: Deploy to AWS EC2

on:
  push:
    branches: [main]

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4

      - name: Configure SSH key
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > "$HOME/.ssh/portfolio-deploy"
          chmod 600 "$HOME/.ssh/portfolio-deploy"

      - name: Deploy Docker stack
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -i "$HOME/.ssh/portfolio-deploy" \
            ubuntu@52.204.158.12 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          cd /home/ubuntu/personal-portfolio

          git pull --ff-only origin main

          # Refuse to fight the legacy host proxy. The first Docker cutover is
          # intentionally performed once from the EC2 browser terminal.
          if sudo systemctl is-active --quiet nginx \
            && ! docker compose ps --status running --services | grep -qx proxy; then
            echo "deploy: host nginx is still active; complete the one-time Docker cutover first" >&2
            exit 1
          fi

          make prod-up
          docker compose ps

          # proxy does plain `proxy_pass http://frontend:80;` / `http://backend:8000;`
          # (no resolver + variable trick), so it caches their Docker-internal IPs at
          # nginx startup/reload time. Recreating those containers above gives them
          # new IPs, which proxy won't notice until it re-resolves DNS -- reload it
          # now so it doesn't keep proxying to now-dead addresses and 502 everything.
          docker compose exec proxy nginx -s reload

          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-connrefused \
            https://its-akki.com/ >/dev/null
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-connrefused \
            https://api.its-akki.com/api/projects/ >/dev/null
          REMOTE
