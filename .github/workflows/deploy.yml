name: Deploy to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: false
        default: portfolio
        type: choice
        options:
          - portfolio
          - posted
          - citepilot

permissions:
  contents: read

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' || inputs.target == 'portfolio'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4

      - name: Configure SSH key
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > "$HOME/.ssh/portfolio-deploy"
          chmod 600 "$HOME/.ssh/portfolio-deploy"

      - name: Build encrypted Job Signal environment file
        shell: bash
        env:
          JOBS_POSTGRES_PASSWORD: ${{ secrets.JOBS_POSTGRES_PASSWORD }}
          JOBS_AUTH_SECRET: ${{ secrets.JOBS_AUTH_SECRET }}
          JOBS_ANTHROPIC_API_KEY: ${{ secrets.JOBS_ANTHROPIC_API_KEY }}
          JOBS_RESEND_API_KEY: ${{ secrets.JOBS_RESEND_API_KEY }}
          JOBS_RESEND_FROM_EMAIL: ${{ secrets.JOBS_RESEND_FROM_EMAIL }}
          JOBS_SIGNALWIRE_SPACE: ${{ secrets.JOBS_SIGNALWIRE_SPACE }}
          JOBS_SIGNALWIRE_PROJECT_ID: ${{ secrets.JOBS_SIGNALWIRE_PROJECT_ID }}
          JOBS_SIGNALWIRE_API_TOKEN: ${{ secrets.JOBS_SIGNALWIRE_API_TOKEN }}
          JOBS_SIGNALWIRE_FROM_NUMBER: ${{ secrets.JOBS_SIGNALWIRE_FROM_NUMBER }}
        run: |
          set -Eeuo pipefail
          umask 077
          python3 - <<'PYTHON' > "$RUNNER_TEMP/job-signal.env"
          import json
          import os

          values = {
              "POSTGRES_PASSWORD": os.environ["JOBS_POSTGRES_PASSWORD"],
              "AUTH_SECRET": os.environ["JOBS_AUTH_SECRET"],
              "AUTH_COOKIE_SECURE": "true",
              "FRONTEND_ORIGINS": "https://jobs.its-akki.com",
              "ANTHROPIC_API_KEY": os.environ["JOBS_ANTHROPIC_API_KEY"],
              "RESEND_API_KEY": os.environ["JOBS_RESEND_API_KEY"],
              "RESEND_FROM_EMAIL": os.environ["JOBS_RESEND_FROM_EMAIL"],
              "SIGNALWIRE_SPACE": os.environ["JOBS_SIGNALWIRE_SPACE"],
              "SIGNALWIRE_PROJECT_ID": os.environ["JOBS_SIGNALWIRE_PROJECT_ID"],
              "SIGNALWIRE_API_TOKEN": os.environ["JOBS_SIGNALWIRE_API_TOKEN"],
              "SIGNALWIRE_FROM_NUMBER": os.environ["JOBS_SIGNALWIRE_FROM_NUMBER"],
              "SCHEDULER_TIMEZONE": "America/New_York",
              "DAILY_EMAIL_HOUR": "8",
          }
          missing = [key for key, value in values.items() if not value]
          if missing:
              raise SystemExit(f"Missing required deployment secrets: {', '.join(missing)}")
          for key, value in values.items():
              print(f"{key}={json.dumps(value)}")
          PYTHON

      - name: Upload Job Signal environment file
        shell: bash
        run: |
          set -Eeuo pipefail
          scp \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -i "$HOME/.ssh/portfolio-deploy" \
            "$RUNNER_TEMP/job-signal.env" \
            ubuntu@52.204.158.12:/home/ubuntu/job-signal.env

      - name: Deploy Docker stack
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -i "$HOME/.ssh/portfolio-deploy" \
            ubuntu@52.204.158.12 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          trap 'rm -f /home/ubuntu/job-signal.env' EXIT
          cd /home/ubuntu/personal-portfolio

          git pull --ff-only origin main

          # Refuse to fight the legacy host proxy. The first Docker cutover is
          # intentionally performed once from the EC2 browser terminal.
          if sudo systemctl is-active --quiet nginx \
            && ! docker compose ps --status running --services | grep -qx proxy; then
            echo "deploy: host nginx is still active; complete the one-time Docker cutover first" >&2
            exit 1
          fi

          make prod-up

          JOBS_DIR=/home/ubuntu/automated_swe_jobs
          if [ ! -d "$JOBS_DIR/.git" ]; then
            git clone https://github.com/akki-g/automated_swe_jobs.git "$JOBS_DIR"
          fi
          git -C "$JOBS_DIR" fetch origin main
          git -C "$JOBS_DIR" checkout main
          git -C "$JOBS_DIR" pull --ff-only origin main
          install -m 600 /home/ubuntu/job-signal.env "$JOBS_DIR/.env"
          rm -f /home/ubuntu/job-signal.env

          docker network inspect portfolio-edge >/dev/null 2>&1 \
            || docker network create portfolio-edge >/dev/null
          docker compose --project-directory "$JOBS_DIR" \
            -f "$JOBS_DIR/compose.production.yml" up --build -d --remove-orphans

          # Keep the portfolio project card data-driven and safe to rerun.
          docker compose exec -T backend python manage.py shell <<'PYTHON'
          from api.models import Project

          Project.objects.update_or_create(
              title="Job Signal",
              defaults={
                  "monthyr": "August 2026",
                  "short_desc": (
                      "A personalized early-career job discovery platform that ingests "
                      "resumes, matches roles across industries, and sends a focused daily digest."
                  ),
                  "description": (
                      "Job Signal combines a React onboarding experience with a FastAPI matching "
                      "pipeline, curated ATS integrations, structured resume extraction, and "
                      "daily email delivery."
                  ),
                  "repo_link": "https://github.com/akki-g/automated_swe_jobs",
                  "live_link": "https://jobs.its-akki.com",
                  "technologies": (
                      "React, TypeScript, Vite, FastAPI, Python, PostgreSQL, SQLAlchemy, "
                      "Anthropic, Resend, Docker, Nginx"
                  ),
              },
          )
          PYTHON

          # Route 53 can be updated without static credentials when EC2 has an
          # instance role with route53:ChangeResourceRecordSets permission.
          # Otherwise the workflow leaves a clear manual DNS instruction.
          if command -v aws >/dev/null 2>&1 \
            && aws sts get-caller-identity >/dev/null 2>&1; then
            ZONE_ID="$(aws route53 list-hosted-zones-by-name \
              --dns-name its-akki.com \
              --query "HostedZones[?Name=='its-akki.com.']|[0].Id" \
              --output text | sed 's#^/hostedzone/##')"
            if [ -n "$ZONE_ID" ] && [ "$ZONE_ID" != "None" ]; then
              aws route53 change-resource-record-sets \
                --hosted-zone-id "$ZONE_ID" \
                --change-batch '{"Changes":[{"Action":"UPSERT","ResourceRecordSet":{"Name":"jobs.its-akki.com","Type":"A","TTL":300,"ResourceRecords":[{"Value":"52.204.158.12"}]}}]}' \
                >/dev/null
              echo "Route 53: jobs.its-akki.com -> 52.204.158.12"
            fi
          fi

          # proxy does plain `proxy_pass http://frontend:80;` / `http://backend:8000;`
          # (no resolver + variable trick), so it caches their Docker-internal IPs at
          # nginx startup/reload time. Recreating those containers above gives them
          # new IPs, which proxy won't notice until it re-resolves DNS -- reload it
          # now so it doesn't keep proxying to now-dead addresses and 502 everything.
          docker compose exec -T proxy nginx -s reload < /dev/null

          docker compose --project-directory "$JOBS_DIR" \
            -f "$JOBS_DIR/compose.production.yml" exec -T web \
            wget -q -O- http://127.0.0.1:8080/healthz \
            </dev/null >/dev/null

          # ACME can only validate after public DNS points at this instance.
          # Query a public resolver instead of the EC2 host resolver, which can
          # retain an earlier NXDOMAIN response during Route 53 propagation.
          PUBLIC_DNS="$(curl --fail --silent --show-error --max-time 10 \
            'https://dns.google/resolve?name=jobs.its-akki.com&type=A' || true)"
          if printf '%s\n' "$PUBLIC_DNS" \
            | grep -Eq '"data"[[:space:]]*:[[:space:]]*"52\.204\.158\.12"'; then
            docker compose run --rm --entrypoint certbot certbot certonly \
              --webroot -w /var/www/certbot \
              --email akshat.guduru@gmail.com --agree-tos --no-eff-email \
              --cert-name its-akki.com --expand --non-interactive \
              -d its-akki.com -d www.its-akki.com -d api.its-akki.com \
              -d citepilot.its-akki.com -d posted.its-akki.com \
              -d jobs.its-akki.com </dev/null
            docker compose exec -T proxy nginx -s reload < /dev/null
            curl --fail --silent --show-error \
              --retry 12 --retry-delay 5 --retry-all-errors \
              https://jobs.its-akki.com/healthz >/dev/null
          else
            echo "DNS pending: add an A record for jobs.its-akki.com -> 52.204.158.12"
          fi

          docker compose ps
          docker compose --project-directory "$JOBS_DIR" \
            -f "$JOBS_DIR/compose.production.yml" ps

          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-connrefused \
            https://its-akki.com/ >/dev/null
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-connrefused \
            https://api.its-akki.com/api/projects/ >/dev/null
          REMOTE

      - name: Remove local secret material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/job-signal.env" "$HOME/.ssh/portfolio-deploy"

  deploy-project:
    if: inputs.target == 'posted' || inputs.target == 'citepilot'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Resolve exact release
        id: release
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -Eeuo pipefail
          case "$TARGET" in
            posted)
              repository=Posted
              public_url=https://posted.its-akki.com
              health_path=/api/v1/health
              ;;
            citepilot)
              repository=CitePilot
              public_url=https://citepilot.its-akki.com
              health_path=/api/health
              ;;
            *)
              echo "unsupported deployment target: $TARGET" >&2
              exit 2
              ;;
          esac
          release_sha="$(git ls-remote --exit-code "https://github.com/akki-g/$repository.git" refs/heads/main | awk 'NR == 1 {print $1}')"
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          {
            echo "repository=$repository"
            echo "release_sha=$release_sha"
            echo "public_url=$public_url"
            echo "health_path=$health_path"
          } >> "$GITHUB_OUTPUT"

      - name: Configure SSH key
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > "$HOME/.ssh/portfolio-deploy"
          chmod 600 "$HOME/.ssh/portfolio-deploy"

      - name: Deploy exact commit without changing the edge proxy
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          REPOSITORY: ${{ steps.release.outputs.repository }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -Eeuo pipefail
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -i "$HOME/.ssh/portfolio-deploy" \
            ubuntu@52.204.158.12 'bash -se' -- "$TARGET" "$REPOSITORY" "$RELEASE_SHA" <<'REMOTE'
          set -Eeuo pipefail
          target="$1"
          repository="$2"
          release_sha="$3"
          case "$target" in
            posted) compose_project=posted ;;
            citepilot) compose_project=citepilot ;;
            *)
              echo "deploy: unsupported target" >&2
              exit 2
              ;;
          esac

          matches=()
          while IFS= read -r -d '' git_dir; do
            app_dir="${git_dir%/.git}"
            origin_url="$(git -C "$app_dir" remote get-url origin 2>/dev/null || true)"
            if [[ "$origin_url" == *"github.com/akki-g/$repository"* || "$origin_url" == *"github.com:akki-g/$repository"* ]]; then
              matches+=("$app_dir")
            fi
          done < <(find /opt /home/ubuntu -type d -name .git -print0 2>/dev/null)

          active_dirs=()
          while read -r container_id; do
            [[ -n "$container_id" ]] || continue
            active_dir="$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project.working_dir"}}' "$container_id")"
            [[ -n "$active_dir" ]] && active_dirs+=("$active_dir")
          done < <(docker ps -aq --filter "label=com.docker.compose.project=$compose_project")

          if [[ "${#matches[@]}" -eq 1 ]]; then
            app_dir="${matches[0]}"
          else
            unique_active_dirs="$(printf '%s\n' "${active_dirs[@]}" | sed '/^$/d' | sort -u)"
            mapfile -t active_dirs <<<"$unique_active_dirs"
            if [[ "${#active_dirs[@]}" -ne 1 ]]; then
              echo "deploy: expected one active $compose_project working directory; found ${#active_dirs[@]}" >&2
              exit 3
            fi
            app_dir="${active_dirs[0]}"
            case " ${matches[*]} " in
              *" $app_dir "*) ;;
              *)
                echo "deploy: active $compose_project working directory does not match a $repository checkout" >&2
                exit 3
                ;;
            esac
          fi

          # The application deployer owns its own lock, volume identity,
          # verified database backup, rollback, and internal health gate.
          bash -lc 'set -Eeuo pipefail
            app_dir="$1"
            release_sha="$2"
            cd "$app_dir"
            git fetch --quiet origin "$release_sha"
            git cat-file -e "$release_sha^{commit}"
            git show "$release_sha":infra/deploy/deploy.sh | bash -s -- "$release_sha" "$app_dir"
          ' bash "$app_dir" "$release_sha"
          REMOTE

      - name: Verify public HTTPS endpoint
        shell: bash
        env:
          PUBLIC_URL: ${{ steps.release.outputs.public_url }}
          HEALTH_PATH: ${{ steps.release.outputs.health_path }}
        run: |
          set -Eeuo pipefail
          for _ in $(seq 1 18); do
            if curl --fail --silent --show-error --max-time 15 "$PUBLIC_URL/" >/dev/null \
              && curl --fail --silent --show-error --max-time 15 "$PUBLIC_URL$HEALTH_PATH" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "public HTTPS verification failed for $PUBLIC_URL" >&2
          exit 1

      - name: Remove local secret material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/portfolio-deploy"
